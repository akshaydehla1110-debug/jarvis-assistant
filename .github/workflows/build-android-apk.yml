name: Build JARVIS Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK (JARVIS Liquid Glass Dynamic Island)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK with Gradle
        working-directory: ./android-jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JARVIS_CLOUD_ENDPOINT: "https://ais-pre-hqb3a5dusfmnkreppjsu7c-7031346790.asia-southeast1.run.app/api/jarvis/intelligence"
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install JARVIS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Liquid-Glass-Android-APK
          path: android-jarvis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
